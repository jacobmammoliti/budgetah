apiVersion: apps/v1
kind: Deployment
metadata:
  name: budgetah-frontend
  labels:
    app: budgetah-frontend
    group: budgetah
spec:
  selector:
    matchLabels:
      app: budgetah-frontend
  template:
    metadata:
      labels:
        app: budgetah-frontend
    spec:
      containers:
        - name: budgetah-frontend
          image: harbor.sourpatch.internal.coldbrewlabs.ca/library/budgetah-frontend:0.1.0-scratch-rfcurated
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: http://budgetah-backend:8000/api/v1
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi